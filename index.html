<script>
// ---------- DAILY PICK + SEEDED NOISE ----------
const dayNow=()=>{const t=new Date();return Math.floor((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(2026,0,1))/864e5)};

const $=id=>document.getElementById(id),V=$("view");
const SHARE_URL="";  // optional: the game’s public address; if empty, the page’s own address is used when hosted

const STATS_CODE="dailyromangeneral";
function track(path,title){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:"game/"+path,title:title||path,event:true})}catch(e){}}
if(HOSTED&&STATS_CODE){const sc=document.createElement("script");sc.async=true;sc.src="https://gc.zgo.at/count.js";sc.dataset.goatcounter="https://"+STATS_CODE+".goatcounter.com/count";document.head.appendChild(sc)}
const LEGENDARY_SUNDAYS=false;  // set true to make every Sunday’s battle legendary (no scouts, harder to win)
let LEG=false;
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function stageFor(k){const d=B.decisions[k]&&B.decisions[k].stage;if(d==null)return STG;if(typeof d==="string")return d;const f=Rules.first(d,S);return f?f.s:STG}
function stageTerrain(n){if(n==="start")return B.terrain;const st=(B.stages||{})[n]||{},T={};for(const k of["grass","ground","tree","sky","lakeColor","trees"])if(B.terrain[k]!==undefined)T[k]=B.terrain[k];

 if(instant){swap();for(const id in UN)UN[id].march=0;return}
 const tt=$("stc");tt.querySelector(".a").textContent=st.label||"";tt.querySelector(".b").textContent=st.title||"";tt.classList.add("on");SFX.drums&&SFX.drums();MARCHD=dir;
 // the army marches off in its direction of travel, the view darkens, and it marches onto the new ground
 for(const id in UN){const p=P[id];if(U[id].s==="r"&&(p[2]==null||p[2]>.3)){P[id]=[p[0]+dir*200,p[1],p[2]];UN[id].march=dir}}place();CT.splice(0,6,-dir*70,105,190,dir*70,0,25);

 b.turns=b.decisions.map(d=>({h:d.title,t:d.text,c:d.choices.map(c=>({l:c.label,q:c.quality,cost:c.cost,style:c.style}))}));
